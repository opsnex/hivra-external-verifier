name: verify

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline verification tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify every published package as an external consumer
        run: ./verify.sh --self-test
